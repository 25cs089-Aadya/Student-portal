<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub | Practical 13</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f2f5fa; color: #1d304a; }
    header { background: #fff; padding: 25px 5%; border-bottom: 1px solid #d9e2ed; text-align: center; }
    h1 { margin: 0; font-size: 32px; color: #20518b; }
    header p { color: #667890; margin-bottom: 0; }
    main { max-width: 1000px; padding: 20px; margin: auto; }
    section { background: #fff; border: 1px solid #d9e2ed; border-radius: 10px; padding: 24px; margin-bottom: 20px; }
    h2 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .wide { grid-column: 1 / -1; }
    label { display: block; font-weight: bold; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #bccada; border-radius: 5px; font: inherit; }
    textarea { min-height: 80px; }
    button, .link { background: #2c5d9b; color: white; border: 0; border-radius: 5px; padding: 10px 16px; cursor: pointer; font: inherit; margin: 4px 5px 4px 0; }
    button:hover { background: #214979; }
    button:disabled { opacity: .6; cursor: wait; }
    .secondary { background: #667991; }
    .delete { background: #ad3535; }
    #message { margin-bottom: 16px; padding: 12px; border-radius: 5px; }
    #message:empty { display: none; }
    #message.error { background: #ffe9e9; color: #9d2525; }
    #message.success { background: #e4f4e8; color: #176b35; }
    #loading { color: #536d8a; }
    .event { border: 1px solid #d9e2ed; border-radius: 6px; margin-top: 12px; padding: 15px; }
    .event h3 { margin-top: 0; color: #20518b; }
    .event p { overflow-wrap: anywhere; }
    a { color: #20518b; }
    @media (max-width: 650px) { .grid { grid-template-columns: 1fr; } .wide { grid-column: 1; } }
  </style>
</head>
<body>
  <header>
    <h1>🎓 StudentHub</h1>
    <p>Practical 13 - Event Management using PHP JSON API and Fetch</p>
  </header>
  <main>
    <p><a href="/prac%2010/admin_dashboard.php">Admin Dashboard</a> | <a href="/prac%2012/events.php">Practical 12 Events</a></p>
    <div id="message" role="status" aria-live="polite"></div>
    <section>
      <h2 id="formTitle">Add New Event</h2>
      <form id="eventForm">
        <div class="grid">
          <div><label for="event_name">Event Name</label><input id="event_name" required maxlength="100"></div>
          <div><label for="event_date">Date and Time</label><input id="event_date" type="datetime-local" required></div>
          <div><label for="venue">Venue</label><input id="venue" required maxlength="200"></div>
          <div><label for="status">Status</label><select id="status"><option>Upcoming</option><option>Ongoing</option><option>Completed</option><option>Cancelled</option></select></div>
          <div class="wide"><label for="description">Description</label><textarea id="description" required maxlength="5000"></textarea></div>
        </div>
        <p><button id="saveButton" type="submit">Add Event</button><button id="cancelButton" class="secondary" type="button" hidden>Cancel Edit</button></p>
      </form>
    </section>
    <section>
      <h2>All Events</h2>
      <button id="refreshButton" type="button">Refresh List</button>
      <p id="loading" role="status">Loading events...</p>
      <div id="events"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
