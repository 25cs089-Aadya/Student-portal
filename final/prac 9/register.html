<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub | Register</title>
  <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../css/studenthub-unified.css">
</head>
<body class="hub-unified"><header class="hub-topbar"><div class="hub-topbar-inner"><a class="hub-brand" href="../index.html">🎓 StudentHub</a><nav class="hub-links" aria-label="StudentHub navigation"><a href="../index.html">Home</a><a href="../pages/timetable.html">Time Table</a><a href="../pages/attendance.html">Attendance</a><a href="../pages/events.html">Events</a><a href="../prac%2014/dashboard.php">Dashboard</a><a class="hub-login" href="../prac%2010/login.php">Login</a></nav></div></header>
  <header class="site-header"><h1>🎓 StudentHub</h1><p>Student Registration</p></header>
  <main class="container">
    <h2>Create Student Account</h2>
    <p>Fill in the details to register for StudentHub.</p>
    <form id="registrationForm" action="process_register.php" method="POST" novalidate>
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>

      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Choose a username" minlength="3" maxlength="50" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" maxlength="10" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" minlength="8" required>
      <div class="strength-track"><div id="strengthBar"></div></div>
      <small id="strengthText">Password strength: Not entered</small>

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required>

      <label for="course">Course</label>
      <select id="course" name="course" required>
        <option value="">-- Select Course --</option>
        <option value="CSE">Computer Science Engineering</option>
        <option value="IT">Information Technology</option>
        <option value="CE">Computer Engineering</option>
        <option value="ECE">Electronics and Communication</option>
        <option value="ME">Mechanical Engineering</option>
      </select>

      <label for="year">Year</label>
      <select id="year" name="year" required>
        <option value="">-- Select Year --</option>
        <option value="1">First Year</option><option value="2">Second Year</option>
        <option value="3">Third Year</option><option value="4">Fourth Year</option>
      </select>

      <fieldset><legend>Gender</legend>
        <label class="inline"><input type="radio" name="gender" value="Male"> Male</label>
        <label class="inline"><input type="radio" name="gender" value="Female"> Female</label>
        <label class="inline"><input type="radio" name="gender" value="Other"> Other</label>
      </fieldset>

      <label class="inline terms"><input type="checkbox" id="terms" name="terms" value="yes"> I agree to the Terms and Conditions.</label>
      <p id="formError" class="error" role="alert" aria-live="polite"></p>
      <button type="submit">Register</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
