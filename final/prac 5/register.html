<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub | Student Registration</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
<link rel="stylesheet" href="../css/studenthub-unified.css">
</head>
<body class="hub-unified"><header class="hub-topbar"><div class="hub-topbar-inner"><a class="hub-brand" href="../index.html">🎓 StudentHub</a><nav class="hub-links" aria-label="StudentHub navigation"><a href="../index.html">Home</a><a href="../pages/timetable.html">Time Table</a><a href="../pages/attendance.html">Attendance</a><a href="../pages/events.html">Events</a><a href="../prac%2014/dashboard.php">Dashboard</a><a class="hub-login" href="../prac%2010/login.php">Login</a></nav></div></header>
  <main class="container">
    <header>
      <p class="brand">StudentHub</p>
      <h1>Student Registration Form</h1>
      <p class="description">Please fill in all the details correctly.</p>
    </header>

    <form id="registrationForm" novalidate>
      <div class="form-group">
        <label for="name">Full Name <span aria-hidden="true">*</span></label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required minlength="2" aria-describedby="nameError">
        <span class="error" id="nameError" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="email">Email Address <span aria-hidden="true">*</span></label>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" autocomplete="email" required aria-describedby="emailError">
        <span class="error" id="emailError" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number <span aria-hidden="true">*</span></label>
        <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" autocomplete="tel" inputmode="numeric" maxlength="10" pattern="[6-9][0-9]{9}" required aria-describedby="mobileError">
        <span class="error" id="mobileError" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="password">Password <span aria-hidden="true">*</span></label>
        <input type="password" id="password" name="password" placeholder="Create a strong password" autocomplete="new-password" minlength="8" required aria-describedby="passwordHint strengthText passwordError">
        <small id="passwordHint" class="hint">Use 8+ characters with uppercase, lowercase, number and special character.</small>
        <div class="strength-track" role="progressbar" id="strengthBar" aria-label="Password strength" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><div id="strengthFill"></div></div>
        <p id="strengthText" class="strength-text" aria-live="polite">Password strength: Not entered</p>
        <span class="error" id="passwordError" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password <span aria-hidden="true">*</span></label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required aria-describedby="confirmPasswordError">
        <span class="error" id="confirmPasswordError" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="course">Course <span aria-hidden="true">*</span></label>
        <select id="course" name="course" required aria-describedby="courseError">
          <option value="">-- Select Course --</option>
          <option value="CSE">Computer Science Engineering</option>
          <option value="IT">Information Technology</option>
          <option value="CE">Computer Engineering</option>
          <option value="ECE">Electronics &amp; Communication</option>
          <option value="ME">Mechanical Engineering</option>
        </select>
        <span class="error" id="courseError" aria-live="polite"></span>
      </div>

      <div class="form-group">
        <label for="year">Year <span aria-hidden="true">*</span></label>
        <select id="year" name="year" required aria-describedby="yearError">
          <option value="">-- Select Year --</option>
          <option value="1">First Year</option>
          <option value="2">Second Year</option>
          <option value="3">Third Year</option>
          <option value="4">Fourth Year</option>
        </select>
        <span class="error" id="yearError" aria-live="polite"></span>
      </div>

      <fieldset id="genderGroup" aria-describedby="genderError">
        <legend>Gender <span aria-hidden="true">*</span></legend>
        <div class="gender-options">
          <label><input type="radio" name="gender" value="Male" required> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </div>
        <span class="error" id="genderError" aria-live="polite"></span>
      </fieldset>

      <div class="terms form-group">
        <label><input type="checkbox" id="terms" name="terms" required aria-describedby="termsError"> I agree to the Terms and Conditions.</label>
        <span class="error" id="termsError" aria-live="polite"></span>
      </div>

      <button type="submit">Register</button>
      <p class="success" id="successMessage" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
